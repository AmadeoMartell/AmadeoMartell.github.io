<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iframe test</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe
      src="https://almasliq.github.io/iframe-test/"
      title="Embedded site"
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
      allow="fullscreen"
    ></iframe>
  </body>
</html>
