<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Medeu SE-2324 — Room Booking | Confirmation</title>
    <style>
        :root{
            --bg1:#0b1020; --bg2:#0f1b3d; --muted:#94a3b8; --text:#e2e8f0;
            --border: rgba(148,163,184,.18); --shadow: 0 18px 60px rgba(0,0,0,.35);
            --radius:18px; --ring:0 0 0 4px rgba(34,197,94,.18);
        }
        *{box-sizing:border-box}
        body{
            margin:0; min-height:100vh; padding:28px;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
            color:var(--text);
            background: radial-gradient(900px 500px at 30% -10%, rgba(34,197,94,.28), transparent 60%),
            radial-gradient(900px 500px at 90% 10%, rgba(96,165,250,.22), transparent 60%),
            linear-gradient(180deg, var(--bg1), var(--bg2));
            display:flex; justify-content:center; align-items:flex-start;
        }
        .card{
            width:min(880px,100%);
            background: linear-gradient(180deg, rgba(15,23,42,.92), rgba(15,23,42,.78));
            border:1px solid var(--border);
            border-radius:var(--radius);
            box-shadow:var(--shadow);
            overflow:hidden;
        }
        .header{padding:18px 20px; border-bottom:1px solid var(--border); background: rgba(2,6,23,.35);}
        .header h1{margin:0; font-size:24px}
        .header p{margin:6px 0 0; color:var(--muted); font-size:13px}
        .content{padding:20px}
        .grid{display:grid; grid-template-columns: 1fr 1fr; gap:12px;}
        @media (max-width: 800px){ .grid{grid-template-columns:1fr} }
        .box{
            padding:14px; border-radius:16px; border:1px solid var(--border); background: rgba(2,6,23,.25);
        }
        .k{color:var(--muted); font-size:12px; margin-bottom:6px}
        .v{font-size:16px; font-weight:800}
        .pill{
            display:inline-flex; gap:8px; align-items:center; font-size:12px; padding:6px 10px;
            border-radius:999px; border:1px solid var(--border); background: rgba(2,6,23,.25); color:var(--muted);
        }
        .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px}
        .btn{
            height:44px; padding:0 14px; border-radius:14px; border:1px solid var(--border);
            background: rgba(2,6,23,.35); color:var(--text); cursor:pointer; font-weight:800;
            text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
        }
        .btn-success{
            background: linear-gradient(135deg, rgba(34,197,94,.95), rgba(16,185,129,.75));
            border-color: rgba(34,197,94,.55);
        }
        .btn-success:hover{filter:brightness(1.05)}
    </style>

    <script>
        function getParam(name) {
            const u = new URL(window.location.href);
            return u.searchParams.get(name) || "";
        }

        function init() {
            const room = getParam("room");
            const date = getParam("date");
            const start = getParam("start");
            const end = getParam("end");
            const purpose = getParam("purpose");
            const user = getParam("user");

            document.getElementById("roomVal").textContent = room;
            document.getElementById("dateVal").textContent = date;
            document.getElementById("timeVal").textContent = `${start} — ${end}`;
            document.getElementById("purposeVal").textContent = purpose;
            document.getElementById("userVal").textContent = user || "Guest";
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</head>

<body>
<div class="card">
    <div class="header">
        <h1 id="confirmTitle">Booking confirmed ✅</h1>
        <p id="confirmSubtitle">Your auditorium reservation has been created.</p>
    </div>

    <div class="content">
        <div class="pill">Project by <strong>Medeu</strong> • <strong>SE-2324</strong></div>

        <div class="grid" style="margin-top:12px;">
            <div class="box">
                <div class="k">Room</div>
                <div class="v" id="roomVal">—</div>
            </div>
            <div class="box">
                <div class="k">Date</div>
                <div class="v" id="dateVal">—</div>
            </div>
            <div class="box">
                <div class="k">Time</div>
                <div class="v" id="timeVal">—</div>
            </div>
            <div class="box">
                <div class="k">Booked by</div>
                <div class="v" id="userVal">—</div>
            </div>
            <div class="box" style="grid-column:1 / -1;">
                <div class="k">Purpose</div>
                <div class="v" id="purposeVal" style="font-size:14px; font-weight:700;">—</div>
            </div>
        </div>

        <div class="row">
            <a class="btn btn-success" id="backToSearchBtn" href="search.html">Back to Search</a>
            <a class="btn" id="newBookingBtn" href="booking.html">New booking</a>
        </div>
    </div>
</div>
</body>
</html>
